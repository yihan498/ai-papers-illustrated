<svg class="d" viewBox="0 0 240 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="三个蓝色方块依次相连：人写示范、人排序给 RM 打分、PPO 用分数改模型；下方一条灰线表示 1.3B 的结果比 175B 的 GPT-3 更常被选中">
