<svg class="d" viewBox="0 0 240 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一个问题先进入蓝色的检索器，从一叠灰色文档里取出相关段落，再交给蓝色方块生成器写出答案；一条蓝色虚线从答案回到检索器">
  <rect class="soft" x="0" y="0" width="240" height="180" rx="10"/>
  <text x="14" y="30" class="sm m">问题</text>
  <path class="mutF" d="M14 40 L28 46 L14 52 Z"/>
  <rect class="newT" x="34" y="30" width="52" height="40" rx="6"/>
  <text x="60" y="55" class="sm tn" text-anchor="middle" style="fill:var(--new)">检索器</text>
  <rect class="softS" x="94" y="20" width="38" height="14" rx="3"/>
  <rect class="softS" x="94" y="39" width="38" height="14" rx="3"/>
  <rect class="softS" x="94" y="58" width="38" height="14" rx="3"/>
  <path class="mutF" d="M138 40 L152 46 L138 52 Z"/>
  <rect class="new" x="158" y="26" width="68" height="48" rx="8"/>
  <text x="192" y="46" class="sm" text-anchor="middle" style="fill:var(--on);font-weight:700">BART</text>
  <text x="192" y="62" class="sm" text-anchor="middle" style="fill:var(--on)">照着写</text>
  <path d="M192 78 V112 H60 V74" style="fill:none;stroke:var(--new);stroke-width:2;stroke-dasharray:5 4"/>
  <text x="120" y="106" class="sm m" text-anchor="middle">答案对不对，传回检索器</text>
  <text x="120" y="146" class="sm m" text-anchor="middle">先查书，再答题</text>
</svg>
